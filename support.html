  <link rel="stylesheet" href="/assets/ds/3d67e511-2482-49b6-8846-c64c523d1a39.css">
  <style>
    /* Page body — remove browser default margin so header sits flush.
       DSes that use position:fixed headers must set --cms-header-height on :root
       so this padding pushes the first content element below the header. */
    body { margin: 0; padding-top: var(--cms-header-height, 0px); }

    /* Default layout: single centred column within the site max-width */
    .cms-page-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 64px;
      box-sizing: border-box;
    }
    .cms-main-content { min-width: 0; }

    /* Two-column layout — left nav enabled (FR-PB-025): nav 3 of 12, main 9 of 12 */
    .cms-has-left-nav {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
      gap: 32px;
      align-items: start;
    }
    /* Right nav placeholder column (population deferred) */
    .cms-has-right-nav {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
      gap: 32px;
      align-items: start;
    }
    .cms-has-left-nav.cms-has-right-nav {
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr);
    }

    /* Mobile — stack columns, match DS spacing.margin-mobile token */
    @media (max-width: 768px) {
      .cms-page-container { padding: 0 16px; }
      .cms-has-left-nav, .cms-has-right-nav { grid-template-columns: 1fr; }
    }
  </style>

</head>
